<title>عروض الأسعار</title>

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{margin:0}
/* Layout: Android-style app. Sticky top bar, scrolling content column, fixed bottom nav. Documents are white paper rendered at A4 width (794px) and scaled to fit. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface2:#e6edf1; --ink:#12242f; --muted:#5a707d; --line:#d3dde3;
  --accent:#0a6c8b; --accent-ink:#ffffff; --accent-soft:#d8ecf3;
  --good:#17803d; --good-soft:#dcf1e3; --warn:#a85a0a; --warn-soft:#fbe9d2; --bad:#b42323; --bad-soft:#f9dcdc;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a21; --surface:#15262f; --surface2:#1c3340; --ink:#e4eef3; --muted:#92a9b6; --line:#2a4352;
  --accent:#4cc0e2; --accent-ink:#06222d; --accent-soft:#17414f;
  --good:#5fd08a; --good-soft:#163a25; --warn:#f0a85a; --warn-soft:#432a10; --bad:#f08a8a; --bad-soft:#4a1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a21; --surface:#15262f; --surface2:#1c3340; --ink:#e4eef3; --muted:#92a9b6; --line:#2a4352;
  --accent:#4cc0e2; --accent-ink:#06222d; --accent-soft:#17414f;
  --good:#5fd08a; --good-soft:#163a25; --warn:#f0a85a; --warn-soft:#432a10; --bad:#f08a8a; --bad-soft:#4a1d1d; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 84px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.bar h1{font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:12px;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:14px;margin:0;color:var(--muted);font-weight:600;letter-spacing:.2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:420px){.grid3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 130px}
.row{width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.row .r1,.row .r3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row .r2{color:var(--muted);font-size:14px}
.row .r3{font-size:13px;color:var(--muted)}
.row .r3 b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.sent{background:var(--accent-soft);color:var(--accent)}
.chip.won,.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.lost,.chip.owe{background:var(--bad-soft);color:var(--bad)}
.chip.part{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:36px;cursor:pointer;font-size:13px;font-weight:500}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fab{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;min-height:52px;padding:0 22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.item .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tile span{display:block;font-size:11px;color:var(--muted)}
.tile b{font-size:15px;font-variant-numeric:tabular-nums;word-break:break-word}
.entry{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .d{font-size:12px;color:var(--muted)}
.entry .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .amt.pay{color:var(--good)}
.empty{text-align:center;color:var(--muted);padding:28px 8px;border:1px dashed var(--line);border-radius:10px;line-height:1.8}
.note{font-size:13px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s}
#toast span.show{opacity:1}
.pvwrap{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}
.pv{width:794px;transform-origin:top right}
/* ---- paper document (always light) ---- */
.doc{display:flex;flex-direction:column;width:794px;min-height:1123px;background:#fff;color:#14232c;padding:44px 54px 48px;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.75;direction:rtl;text-align:right}
.doc .d-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0a6c8b;padding-bottom:12px;margin-bottom:16px}
.doc .d-co{font-size:20px;font-weight:700;color:#0a6c8b}
.doc .d-title{font-size:30px;font-weight:700;color:#14232c}
.doc .d-meta{display:flex;gap:36px;margin-bottom:10px;color:#3b505c}
.doc .d-meta b{color:#14232c;font-variant-numeric:tabular-nums}
.doc .d-to{font-size:17px;margin-bottom:14px}
.doc table.d-t{width:100%;border-collapse:collapse;margin-bottom:12px}
.doc .d-t th{background:#dcecf2;color:#0b3a4a;font-weight:600;padding:8px 10px;border:1px solid #aac3cd;font-size:14px}
.doc .d-t td{padding:8px 10px;border:1px solid #c3d3da;vertical-align:top}
.doc .d-t .c{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.doc .d-t tr.sum td{background:#f2f7f9;font-weight:700}
.doc .d-tot{margin:6px 0 18px;font-size:15px}
.doc .d-tot div{display:flex;justify-content:flex-end;gap:24px;font-variant-numeric:tabular-nums}
.doc .d-tot .g{font-size:18px;font-weight:700;color:#0a6c8b}
.doc ul{margin:0 0 18px;padding:0;list-style:none}
.doc li{margin:0 0 4px}
.doc li::before{content:"- ";font-weight:700}
.doc .d-foot{margin-top:auto;padding-top:24px}
.doc .d-close{text-align:center;font-size:16px;margin:0 0 14px}
.doc .d-sign{line-height:1.8;text-align:left;direction:rtl}
.doc .d-stamp{width:300px;display:block;margin:0 auto 0 0}
.doc .d-sign b{font-size:16px}
.doc bdi{unicode-bidi:isolate;direction:ltr}
.doc .pos{color:#14232c}
.doc .neg{color:#b42323}
.offscreen{position:fixed;left:-12000px;top:0;width:794px}
</style>

const STATUS={draft:'مسودة',sent:'مرسل',won:'مقبول',lost:'مرفوض'};
let S={settings:{...DEFAULTS},customers:[],quotes:[],ledger:[]};
function dig(s){return S.settings.arabicDigits?String(s).replace(/\d/g,d=>AR[d]).replace(/,/g,'٬').replace(/\./g,'٫'):String(s)}
const n=x=>dig((Math.round((+x||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}));
const money=x=>n(x)+(S.settings.currency?' '+S.settings.currency:'');
const fmtDate=iso=>{if(!iso)return '';const p=iso.split('-');return dig(+p[2]+'/'+(+p[1])+'/'+p[0])};
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const br=s=>esc(s).replace(/\n/g,'<br>');
function toast(m){const el=$('#toastmsg');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
function confirmTap(btn,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed=1;const old=btn.textContent;btn.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{delete btn.dataset.armed;btn.textContent=old},3000)}

/* ============ storage (db capability, with local fallback) ============ */
let db=null,dl=null,usingDb=false;const LS='quotes-app-v1';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o){S={settings:{...DEFAULTS,...o.settings},customers:o.customers||[],quotes:o.quotes||[],ledger:o.ledger||[]}}}catch(e){}}
const clean=o=>JSON.parse(JSON.stringify(o));
const wq={};
function enqueue(key,fn){wq[key]=(wq[key]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast('تعذر الحفظ على الخادم')})}
function put(col,obj){
  const a=S[col],i=a.findIndex(x=>x.id===obj.id);if(i<0)a.push(obj);else a[i]=obj;
  if(usingDb){const {id,...rest}=obj;enqueue(col+'/'+id,()=>db.collection(col).doc(id).set(clean(rest)))}else lsSave();
}
function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(usingDb)enqueue(col+'/'+id,()=>db.collection(col).doc(id).delete());else lsSave();
}
function saveSettings(){
  if(usingDb)enqueue('config/main',()=>db.doc('config/main').set(clean(S.settings)));else lsSave();
}
function softRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a))return;render()}
async function initStore(){
  lsLoad();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ============ calculations ============ */
const totals=q=>{const sub=q.items.reduce((a,it)=>a+toNum(it.q)*toNum(it.price),0);const vat=sub*toNum(q.vatPct)/100;return{sub,vat,total:sub+vat}};
const bal=cid=>{let c=0,p=0;S.ledger.forEach(e=>{if(e.customerId===cid){if(e.type==='payment')p+=+e.amount;else c+=+e.amount}});return{c,p,r:c-p}};
function stmtData(cid,from,to){
  const all=S.ledger.filter(e=>e.customerId===cid).sort((a,b)=>(a.date.localeCompare(b.date))||((a.ts||0)-(b.ts||0)));
  let opening=0;const rows=[];let run=0,tc=0,tp=0;
  all.forEach(e=>{const v=e.type==='payment'?-e.amount:+e.amount;
    if(from&&e.date<from){opening+=v;return}
    if(to&&e.date>to)return;rows.push(e)});
  run=opening;
  const out=rows.map(e=>{const ch=e.type==='payment'?0:+e.amount,pa=e.type==='payment'?+e.amount:0;run+=ch-pa;tc+=ch;tp+=pa;return{date:e.date,desc:e.desc,ch,pa,run}});
  return{opening,rows:out,tc,tp,closing:run};
}

/* ============ paper documents ============ */
function quoteDoc(q){
  const s=S.settings,t=totals(q);
  const rows=q.items.map(it=>`<tr><td class="c">${n(toNum(it.q))}</td><td>${br(it.desc)}</td><td class="c">${n(toNum(it.price))}</td><td class="c">${n(toNum(it.q)*toNum(it.price))}</td></tr>`).join('');
  const vat=toNum(q.vatPct)>0;
  return `<div class="doc">
<div class="d-top"><div class="d-co">${esc(s.company)}</div><div class="d-title">عرض سعر</div></div>
<div class="d-meta"><span>التاريخ: <b>${fmtDate(q.date)}</b></span><span>كود العرض: <b>${n(q.no)}</b></span></div>
<div class="d-to">السادة / <b>${esc(q.customerName)}</b></div>
<table class="d-t"><thead><tr><th style="width:70px">الكمية</th><th>البيان</th><th style="width:110px">سعر الوحدة</th><th style="width:120px">الإجمالي</th></tr></thead><tbody>${rows}</tbody></table>

/* ============ export: PDF ============ */
async function saveFile(name,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
  try{
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  try{
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);toast('تم تنزيل الملف');return true;
  }catch(e){toast('تعذر حفظ الملف');return false}
}
async function exportPdf(html,name,btn){
  const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='جاري التجهيز…'}
  const host=document.createElement('div');host.className='offscreen';host.innerHTML=html;document.body.appendChild(host);
  try{
    if(!window.html2canvas||!window.jspdf)throw new Error('libs');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const el=host.firstElementChild;
    const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,width:794,windowWidth:794});
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    const PW=595.28,PH=841.89,ratio=PW/cv.width,pagePx=Math.floor(PH/ratio);
    let y=0,first=true;
    while(y<cv.height){
      const h=Math.min(pagePx,cv.height-y);
      const pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;
      const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,h);cx.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',0,0,PW,h*ratio);
      y+=h;
    }
    await saveFile(name,pdf.output('blob'));
  }catch(e){console.error(e);toast('تعذر إنشاء ملف PDF')}
  finally{host.remove();if(btn){btn.disabled=false;btn.textContent=old}}
}

async function exportDocx(bodyXml,name,btn){
  const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='جاري التجهيز…'}
  try{
    if(!window.JSZip)throw new Error('jszip');

    const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    z.file('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
    z.file('_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');

    const blob=await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});

  <div class="card"><h2>إرسال وتصدير</h2><div class="btns"><button class="btn pri" data-act="qPdf">ملف PDF</button><button class="btn pri" data-act="qWord">ملف Word</button></div>
   <div class="note">يُحفظ العرض تلقائيا عند التصدير، ثم تختار مكان الحفظ أو المشاركة (واتساب وغيره) من الجهاز.</div>
   <div class="btns"><button class="btn" data-act="qCharge" ${hasCharge?'disabled':''}>${hasCharge?'تم ترحيله لحساب العميل':'ترحيل لحساب العميل (مستحق)'}</button><button class="btn" data-act="qDup">نسخ كعرض جديد</button>${D.isNew?'':'<button class="btn dng" data-act="qDel">حذف العرض</button>'}</div></div>
  <div class="card"><h2>معاينة</h2><div class="pvwrap" id="pvwrap"><div class="pv" id="pv"></div></div></div></div>`;
}
let pvT;
function refreshPreview(){
  const pv=$('#pv');if(!pv)return;pv.innerHTML=quoteDoc(D);fit('#pvwrap','#pv');
}
function fit(w,p){const wr=$(w),pv=$(p);if(!wr||!pv)return;const sc=Math.min(1,wr.clientWidth/794);pv.style.transform=`scale(${sc})`;wr.style.height=(pv.offsetHeight*sc)+'px'}
window.addEventListener('resize',()=>{if(view.name==='quote')fit('#pvwrap','#pv');if(view.name==='statement')fit('#swrap','#spv')});
function recalc(){D.items.forEach((it,i)=>{const e=$('#lt'+i);if(e)e.textContent=n(toNum(it.q)*toNum(it.price))});$('#totals').innerHTML=totalsHTML();clearTimeout(pvT);pvT=setTimeout(refreshPreview,200)}
function saveDraft(){
  if(!D.customerName.trim()){toast('اكتب اسم العميل أولا');return null}
  D.items=D.items.filter(it=>it.desc.trim()||toNum(it.price)||D.items.length===1);
  if(!D.customerId){
    const nm=D.customerName.trim();let c=S.customers.find(x=>x.name.trim()===nm);
    if(!c){c={id:uid(),name:nm,phone:'',address:'',notes:''};put('customers',c);toast('تمت إضافة العميل لقاعدة العملاء')}
    D.customerId=c.id;
  }
  const o=clean(D);delete o.isNew;o.no=Math.round(toNum(o.no))||S.settings.nextNo;o.vatPct=toNum(o.vatPct);o.items=o.items.map(it=>({q:toNum(it.q),desc:it.desc,price:toNum(it.price)}));
  put('quotes',o);D.no=o.no;D.isNew=false;
  if(o.no>=S.settings.nextNo){S.settings.nextNo=o.no+1;saveSettings()}
  return o;
}
function qForExport(o){return{...o,items:o.items,terms:o.terms}}

/* ----- customers ----- */
function customersView(){
  return bar('العملاء','','',dig(S.customers.length)+' عميل')+`<div class="stack">
  <input id="csearch" type="search" placeholder="بحث باسم العميل أو الهاتف" value="${esc(F.cq)}">
  <div id="clist" class="stack" style="padding:0"></div></div><button class="fab" data-act="newCust">+ عميل جديد</button>`;
}
function customersList(){
  const q=F.cq.trim().toLowerCase();
  const list=S.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  $('#clist').innerHTML=list.length?list.map(c=>{const b=bal(c.id);
    const chip=b.c===0&&b.p===0?'':b.r>0?`<span class="chip owe">عليه ${money(b.r)}</span>`:b.r<0?`<span class="chip part">له ${money(-b.r)}</span>`:`<span class="chip ok">مسدد</span>`;
    return `<button class="row" data-act="openCust" data-id="${c.id}"><div class="r1"><b>${esc(c.name)}</b>${chip}</div><div class="r2">${esc(c.phone||'')}</div>
    <div class="r3"><span>${dig(S.quotes.filter(x=>x.customerId===c.id).length)} عرض سعر</span><span>إجمالي الأعمال ${money(b.c)}</span></div></button>`}).join('')
    :`<div class="empty">${S.customers.length?'لا توجد نتائج مطابقة.':'لا يوجد عملاء بعد.<br>يضاف العميل تلقائيا عند حفظ أول عرض له، أو اضغط «+ عميل جديد».'}</div>`;
}
function ledgerFormHTML(){
  if(!L)return '';
  const pay=L.type==='payment';
  return `<div class="card"><h2>${pay?'تسجيل دفعة مستلمة':'إضافة عمل / مستحق'}</h2>
  <div class="grid2"><div class="f"><label for="ld">التاريخ</label><input id="ld" type="date" data-l="date" value="${L.date}"></div>
  <div class="f"><label for="la">المبلغ</label><input id="la" class="num" inputmode="decimal" data-l="amount" value="${esc(L.amount)}"></div></div>
  <div class="f"><label for="ldesc">البيان</label><input id="ldesc" data-l="desc" value="${esc(L.desc)}" placeholder="${pay?'مثال: دفعة نقدية عند التعاقد':'مثال: صيانة وحدة تبريد'}"></div>
  <div class="btns"><button class="btn pri" data-act="lSave">حفظ</button><button class="btn" data-act="lCancel">إلغاء</button></div></div>`;
}
function customerView(){
  const b=bal(C.id),ents=S.ledger.filter(e=>e.customerId===C.id).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)),qs=S.quotes.filter(x=>x.customerId===C.id).sort((a,b)=>b.date.localeCompare(a.date));
  return bar(esc(C.name)||'عميل جديد',backBtn('tab','customers'),`<button class="btn pri sm" data-act="cSave">حفظ</button>`)+`<div class="stack">
  <div class="card"><h2>بيانات العميل</h2>
   <div class="f"><label for="cn">الاسم</label><input id="cn" data-c="name" value="${esc(C.name)}"></div>
   <div class="grid2"><div class="f"><label for="cp">الهاتف</label><input id="cp" class="num" inputmode="tel" data-c="phone" value="${esc(C.phone)}"></div>
   <div class="f"><label for="ca">العنوان</label><input id="ca" data-c="address" value="${esc(C.address)}"></div></div>
   <div class="f"><label for="cno">ملاحظات</label><textarea id="cno" data-c="notes" rows="2">${esc(C.notes)}</textarea></div></div>
  ${C.isNew?'':`<div class="card"><h2>الحساب</h2>
   <div class="tiles"><div class="tile"><span>إجمالي الأعمال</span><b>${money(b.c)}</b></div><div class="tile"><span>المدفوع</span><b>${money(b.p)}</b></div><div class="tile"><span>${b.r<0?'له (زيادة)':'المتبقي عليه'}</span><b style="color:${b.r>0?'var(--bad)':'var(--good)'}">${money(Math.abs(b.r))}</b></div></div>
   <div class="btns"><button class="btn soft" data-act="lNew" data-id="charge">+ عمل / مستحق</button><button class="btn soft" data-act="lNew" data-id="payment">+ دفعة</button><button class="btn pri" data-act="stmt">كشف حساب</button></div></div>
  ${ledgerFormHTML()}
  <div class="card"><h2>حركة الحساب</h2>${ents.length?ents.map(e=>`<div class="entry"><div><div>${esc(e.desc)||(e.type==='payment'?'دفعة':'عمل')}</div><div class="d">${fmtDate(e.date)} · ${e.type==='payment'?'دفعة':'مستحق'}</div></div><div style="text-align:end"><div class="amt ${e.type==='payment'?'pay':''}">${e.type==='payment'?'−':''}${money(e.amount)}</div><button class="btn sm dng" style="margin-top:4px" data-act="lDel" data-id="${e.id}">حذف</button></div></div>`).join(''):'<div class="note">لا توجد حركات بعد.</div>'}</div>
  <div class="card"><h2>عروض الأسعار</h2>${qs.length?qs.map(x=>`<button class="row" data-act="openQuote" data-id="${x.id}"><div class="r1"><b>عرض رقم ${n(x.no)}</b><span class="chip ${x.status}">${STATUS[x.status]}</span></div><div class="r3"><span>${fmtDate(x.date)}</span><b>${money(totals(x).total)}</b></div></button>`).join(''):'<div class="note">لا توجد عروض لهذا العميل.</div>'}
   <button class="btn soft" data-act="newQuoteFor">+ عرض سعر لهذا العميل</button></div>
  <button class="btn dng" data-act="cDel">حذف العميل</button>`}</div>`;
}

/* ----- statement ----- */
function statementView(){
  const c=S.customers.find(x=>x.id===ST.cid);
  return bar('كشف حساب',backBtn('openCust',ST.cid),'',esc(c?c.name:''))+`<div class="stack">
  <div class="card"><div class="grid2"><div class="f"><label for="sf">من تاريخ</label><input id="sf" type="date" data-s="from" value="${ST.from}"></div><div class="f"><label for="st">إلى تاريخ</label><input id="st" type="date" data-s="to" value="${ST.to}"></div></div>
  <div class="btns"><button class="btn pri" data-act="sPdf">ملف PDF</button><button class="btn pri" data-act="sWord">ملف Word</button></div></div>
  <div class="card"><h2>معاينة</h2><div class="pvwrap" id="swrap"><div class="pv" id="spv"></div></div></div></div>`;
}
function refreshStmt(){
  const c=S.customers.find(x=>x.id===ST.cid);if(!c)return;
  const d=stmtData(c.id,ST.from,ST.to);$('#spv').innerHTML=stmtDoc(c,d,ST.from,ST.to);fit('#swrap','#spv');
}

/* ----- settings ----- */
function settingsView(){
  const s=S.settings;
  return bar('الإعدادات')+`<div class="stack">
  ${'<div class="warnbox">البيانات تُحفظ على هذا الجهاز فقط. خذ نسخة احتياطية من الأسفل بانتظام، وقبل مسح بيانات المتصفح أو تغيير الهاتف.</div>'}
  <div class="card"><h2>بيانات الشركة في العروض</h2>
   <div class="f"><label for="s1">اسم الشركة</label><input id="s1" data-s2="company" value="${esc(s.company)}"></div>
   <div class="f"><label for="s2">الإدارة</label><input id="s2" data-s2="dept" value="${esc(s.dept)}"></div>
   <div class="f"><label for="s3">أرقام الهاتف</label><input id="s3" class="num" data-s2="phones" value="${esc(s.phones)}"></div>
   <div class="grid2"><div class="f"><label for="s4">العملة</label><input id="s4" data-s2="currency" value="${esc(s.currency)}"></div>
   <div class="f"><label for="s5">رقم العرض التالي</label><input id="s5" class="num" inputmode="numeric" data-s2="nextNo" value="${s.nextNo}"></div></div>
   <div class="f"><label for="s6">عبارة الختام</label><input id="s6" data-s2="closing" value="${esc(s.closing)}"></div>
   <div class="f"><label for="s7">الشروط الافتراضية للعروض الجديدة (كل سطر بند)</label><textarea id="s7" rows="6" data-s2="terms">${esc(s.terms.join('\n'))}</textarea></div>
   <div class="f"><label for="s9">ختم الشركة وتوقيع المدير في العروض وكشوف الحساب</label><select id="s9" data-s2="stamp"><option value="1" ${s.stamp?'selected':''}>إظهار الختم</option><option value="0" ${s.stamp?'':'selected'}>إخفاء الختم (نص بدلا منه)</option></select></div>
   <div class="f"><label for="s8">شكل الأرقام</label><select id="s8" data-s2="arabicDigits"><option value="1" ${s.arabicDigits?'selected':''}>أرقام عربية ١٢٣</option><option value="0" ${s.arabicDigits?'':'selected'}>أرقام إنجليزية 123</option></select></div></div>
  <div class="card"><h2>نسخة احتياطية</h2><div class="btns"><button class="btn" data-act="backup">حفظ نسخة احتياطية</button><button class="btn" data-act="restore">استرجاع من نسخة</button></div>
   <div class="note">النسخة ملف JSON يحتوي العملاء والعروض والحسابات والإعدادات.</div></div></div>`;
}

/* ============ events ============ */
const acts={
  tab(d){if(d.id==='quotes')go('quotes');else if(d.id==='customers')go('customers');else go('settings')},
  qfilter(d){F.st=d.id;render()},
  newQuote(){D=newQuote();go('quote')},
  openQuote(d){const q=S.quotes.find(x=>x.id===d.id);if(!q)return;D=clean(q);D.vatPct=D.vatPct||0;go('quote')},
  newQuoteFor(){D=newQuote();D.customerId=C.id;D.customerName=C.name;go('quote')},
  addItem(){D.items.push({q:1,desc:'',price:0});$('#items').innerHTML=itemsHTML();recalc();const t=$('#items').querySelectorAll('textarea');t[t.length-1].focus()},
  delItem(d){D.items.splice(+d.id,1);$('#items').innerHTML=itemsHTML();recalc()},
  qSave(){if(saveDraft()){toast('تم حفظ العرض');render()}},
  async qPdf(d,b){const o=saveDraft();if(!o)return;await exportPdf(quoteDoc(o),`عرض-سعر-${o.no}.pdf`,b)},
  async qWord(d,b){const o=saveDraft();if(!o)return;await exportDocx(quoteDocx(o),`عرض-سعر-${o.no}.docx`,b)},
  qCharge(){const o=saveDraft();if(!o)return;put('ledger',{id:uid(),customerId:o.customerId,date:o.date,type:'charge',amount:totals(o).total,desc:'عرض سعر رقم '+o.no+(o.items[0]&&o.items[0].desc?' - '+o.items[0].desc.split('\n')[0].slice(0,60):''),quoteId:o.id,ts:Date.now()});
    if(o.status==='draft'||o.status==='sent'){D.status='won';o.status='won';put('quotes',o)}toast('تم الترحيل لحساب العميل');render()},
  qDup(){const o=saveDraft();if(!o)return;D={...clean(o),id:uid(),no:S.settings.nextNo,date:today(),status:'draft',isNew:true};toast('نسخة جديدة جاهزة للتعديل');render();window.scrollTo(0,0)},
  qDel(d,b){confirmTap(b,()=>{del('quotes',D.id);go('quotes')})},
  newCust(){C={id:uid(),name:'',phone:'',address:'',notes:'',isNew:true};go('customer')},
  openCust(d){const c=S.customers.find(x=>x.id===d.id);if(!c)return;C=clean(c);L=null;go('customer')},
  cSave(){if(!C.name.trim()){toast('اكتب اسم العميل');return}const o=clean(C);delete o.isNew;put('customers',o);C.isNew=false;toast('تم حفظ العميل');render()},
  cDel(d,b){confirmTap(b,()=>{S.ledger.filter(e=>e.customerId===C.id).forEach(e=>del('ledger',e.id));del('customers',C.id);go('customers')})},
  lNew(d){L={type:d.id,date:today(),amount:'',desc:''};render();$('#la')&&$('#la').focus()},
  lCancel(){L=null;render()},
  lSave(){const a=toNum(L.amount);if(!a){toast('اكتب المبلغ');return}put('ledger',{id:uid(),customerId:C.id,date:L.date,type:L.type,amount:a,desc:L.desc,ts:Date.now()});L=null;toast('تم تسجيل الحركة');render()},
  lDel(d,b){confirmTap(b,()=>{del('ledger',d.id);render()})},
  stmt(){const ds=S.ledger.filter(e=>e.customerId===C.id).map(e=>e.date).sort();ST={cid:C.id,from:ds[0]||today(),to:today()};go('statement')},
  async sPdf(d,b){const c=S.customers.find(x=>x.id===ST.cid),x=stmtData(c.id,ST.from,ST.to);await exportPdf(stmtDoc(c,x,ST.from,ST.to),`كشف-حساب-${c.name}.pdf`,b)},
  async sWord(d,b){const c=S.customers.find(x=>x.id===ST.cid),x=stmtData(c.id,ST.from,ST.to);await exportDocx(stmtDocx(c,x,ST.from,ST.to),`كشف-حساب-${c.name}.docx`,b)},
  async backup(){await saveFile(`نسخة-احتياطية-${today()}.json`,JSON.stringify({v:1,settings:S.settings,customers:S.customers,quotes:S.quotes,ledger:S.ledger}))},
  restore(){$('#importfile').click()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const f=acts[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qsearch'){F.q=t.value;quotesList();return}
  if(t.id==='csearch'){F.cq=t.value;customersList();return}
  if(t.dataset.i!=null){const it=D.items[+t.dataset.i];it[t.dataset.k]=t.value;recalc();return}
  if(t.dataset.f){const k=t.dataset.f;if(k==='termsText')D.terms=lines(t.value);else{D[k]=t.value;if(k==='customerName')D.customerId=''}
    if(k==='vatPct')recalc();else{clearTimeout(pvT);pvT=setTimeout(refreshPreview,200)}return}
  if(t.dataset.c){C[t.dataset.c]=t.value;return}
  if(t.dataset.l){L[t.dataset.l]=t.value;return}
  if(t.dataset.s){ST[t.dataset.s]=t.value;refreshStmt();return}
  if(t.dataset.s2){const k=t.dataset.s2,s=S.settings;
    if(k==='terms')s.terms=lines(t.value);else if(k==='nextNo')s.nextNo=Math.max(1,Math.round(toNum(t.value))||1);else if(k==='arabicDigits')s.arabicDigits=t.value==='1';else if(k==='stamp')s.stamp=t.value==='1';else s[k]=t.value;
    clearTimeout(acts.sT);acts.sT=setTimeout(saveSettings,600)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cust'){const c=S.customers.find(x=>x.id===t.value);D.customerId=c?c.id:'';if(c){D.customerName=c.name;$('#cname').value=c.name}refreshPreview();return}
  if(t.dataset.f==='status'||t.dataset.f==='date'){D[t.dataset.f]=t.value;refreshPreview()}
  if(t.id==='importfile'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{
      const o=JSON.parse(r.result);if(!o||!o.customers)throw 0;
      S.settings={...DEFAULTS,...o.settings};saveSettings();
      ['customers','quotes','ledger'].forEach(c=>(o[c]||[]).forEach(x=>put(c,x)));
      toast('تم استرجاع النسخة');render();
    }catch(err){toast('ملف النسخة غير صالح')}t.value=''};r.readAsText(t.files[0]);
  }
});
render();initStore();
</script>
</body></html>
